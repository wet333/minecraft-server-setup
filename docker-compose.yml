services:
  mc:
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    ports:
      # Game port
      - "25565:25565/tcp"
      # Voice chat port
      - "24454:24454/udp"
    environment:
      EULA: "TRUE"
      MOTD: "Coolify awet333 Minecraft Server"
      ICON: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_VJWUjCVt1q53Y27_4rpcVwIQDf4TxmLAOg&s"
      OVERRIDE_ICON: "true"
      DIFFICULTY: "hard"
      MODE: "survival"
      SEED: "sad46a54sd6a5s4d6a5s4d"
      PVP: "false"
      TYPE: "FABRIC"
      VERSION: "1.21"
      MODRINTH_PROJECTS: "fabric-api:oGwyXeEI, fallingtree:9n1NLElA, tectonic:mSYrCaov, simple-voice-chat:Fku4RjPN"
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      REMOVE_OLD_MODS: "true"
      MAX_MEMORY: 8G
      INIT_MEMORY: 2G
    volumes:
      - ./data:/data